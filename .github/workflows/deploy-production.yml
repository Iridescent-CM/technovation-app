name: Deploy Production

run-name: "Deploy prod: ${{ inputs.deploy_ref }} (${{ inputs.release_version != '' && inputs.release_version || inputs.version_bump }})${{ inputs.dry_run == true && ' [dry-run]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Branch, tag, or SHA to deploy (default qa; use a previous release tag to roll back)
        type: string
        default: qa
        required: true
      version_bump:
        description: Version bump (ignored when deploy_ref is already a release tag, or release_version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      release_version:
        description: Explicit version, e.g. 7.21.0 (overrides version_bump)
        type: string
      dry_run:
        description: Run all checks but skip Heroku push, verify, tag, release, and branch pointer
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      new_tag: ${{ steps.version.outputs.new_tag }}
      existing_tag: ${{ steps.version.outputs.existing_tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
    steps:
      - name: Verify actor has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel(
              { ...context.repo, username: context.actor });
            if (!["admin", "maintain", "write"].includes(data.permission))
              core.setFailed(`Deploy blocked: ${context.actor} lacks write access (${data.permission})`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: resolve
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require green CircleCI build on target commit
        uses: actions/github-script@v7
        with:
          script: |
            const ref = "${{ steps.resolve.outputs.sha }}";
            const { data } = await github.rest.repos.getCombinedStatusForRef({ ...context.repo, ref });
            const ci = data.statuses.find(s => s.context === "ci/circleci: build");
            if (!ci || ci.state !== "success")
              core.setFailed(`CircleCI build not green for ${ref} (${ci ? ci.state : "no status found"})`);

      - name: Compute or detect release version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
          EXPLICIT: ${{ inputs.release_version }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'

          # Rollback case: deployed commit already carries a release tag -> no new tag.
          existing="$( (git tag --points-at "$SHA" | grep -E "$semver" || true) | sort -V | tail -n1 )"
          if [ -n "$existing" ] && [ -z "$EXPLICIT" ]; then
            echo "Deploying existing release $existing (no new tag will be created)"
            echo "existing_tag=$existing" >> "$GITHUB_OUTPUT"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prev="$( (git tag -l | grep -E "$semver" || true) | sort -V | tail -n1 )"
          echo "prev_tag=${prev:-none}" >> "$GITHUB_OUTPUT"
          IFS='.' read -r MA MI PA <<< "${prev:-0.0.0}"
          if [ -n "$EXPLICIT" ]; then
            next="$EXPLICIT"
          else
            case "$BUMP" in
              major) next="$((MA + 1)).0.0" ;;
              minor) next="${MA}.$((MI + 1)).0" ;;
              patch) next="${MA}.${MI}.$((PA + 1))" ;;
            esac
          fi
          [[ "$next" =~ $semver ]] || { echo "Invalid version: $next"; exit 1; }
          git rev-parse -q --verify "refs/tags/$next" >/dev/null && { echo "Tag $next already exists"; exit 1; }
          highest="$(printf '%s\n%s\n' "$prev" "$next" | sort -V | tail -n1)"
          [ "$next" = "$highest" ] || { echo "Version $next must be greater than latest tag $prev"; exit 1; }
          echo "existing_tag=" >> "$GITHUB_OUTPUT"
          echo "new_tag=$next" >> "$GITHUB_OUTPUT"

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60   # Heroku build (blocking push) + up to 30 min release-phase poll + smoke test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0

      # The releases list API paginates oldest-first by default; without the Range header the
      # first page is years-old releases and "latest" would be wrong. Capturing the version
      # before the push also avoids the race where, right after the push, the newest release
      # is still the previous (succeeded) one and the poll would pass against the wrong release.
      - name: Capture current Heroku release version
        if: ${{ !inputs.dry_run }}
        id: pre_release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          v="$(curl -sf \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Range: version ..; order=desc,max=1" \
            "https://api.heroku.com/apps/technovation/releases" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)[0]["version"])')"
          echo "Current Heroku release before deploy: v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Push to Heroku
        if: ${{ !inputs.dry_run }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          set -euo pipefail
          git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/technovation.git" "$SHA:refs/heads/master"

      - name: Wait for Heroku release phase to succeed
        if: ${{ !inputs.dry_run }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          PRE_VERSION: ${{ steps.pre_release.outputs.version }}
        run: |
          set -euo pipefail
          # Poll up to 30 minutes (180 x 10s): the release phase runs db:migrate and slow
          # migrations legitimately take more than a few minutes. Transient API errors are
          # tolerated (retried on the next iteration) instead of failing the job after the
          # code is already pushed.
          for i in $(seq 1 180); do
            latest="$(curl -s \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              -H "Range: version ..; order=desc,max=1" \
              "https://api.heroku.com/apps/technovation/releases" \
              | python3 -c '
          import sys, json
          try:
              r = json.load(sys.stdin)[0]
              print(r["version"], r["status"])
          except Exception:
              print("0 api-error")' || echo "0 api-error")"
            read -r version status <<< "$latest"
            echo "Heroku release: v$version ($status)"
            if [ "$version" -gt "$PRE_VERSION" ]; then
              [ "$status" = "succeeded" ] && exit 0
              [ "$status" = "failed" ] && { echo "Heroku release phase failed (check migrations)"; exit 1; }
            fi
            sleep 10
          done
          echo "Timed out waiting for Heroku release phase (30 minutes)"
          exit 1

      - name: HTTP smoke test
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Retry for up to 2 minutes: dynos restart right after the release phase, so the
          # first requests can hit the restart window (503) even on a healthy deploy.
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://my.technovationchallenge.org/ || echo 000)"
            echo "Attempt $i: homepage returned HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then exit 0; fi   # any non-5xx means the app booted
            sleep 10
          done
          echo "Smoke test failed: homepage still unhealthy after 2 minutes"
          exit 1

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "[dry-run] Skipped Heroku push, release-phase poll, and smoke test."

  release:
    needs: [guard, deploy]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish GitHub Release
        if: ${{ needs.guard.outputs.new_tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.new_tag }}
          SHA: ${{ needs.guard.outputs.sha }}
          PREV: ${{ needs.guard.outputs.prev_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Production release $TAG"
          git push origin "$TAG"
          if [ "$PREV" = "none" ]; then
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes --notes-start-tag "$PREV"
          fi

      - name: Rollback notice
        if: ${{ needs.guard.outputs.existing_tag != '' }}
        run: echo "Redeployed existing release ${{ needs.guard.outputs.existing_tag }}; no new tag created."

      - name: Update production branch pointer
        env:
          SHA: ${{ needs.guard.outputs.sha }}
          ROLLBACK: ${{ needs.guard.outputs.existing_tag }}
        run: |
          set -euo pipefail
          if [ -n "$ROLLBACK" ]; then
            # Rollback moves the pointer backwards; a plain push would be rejected as non-fast-forward.
            git push --force origin "$SHA:refs/heads/production"
          else
            git push origin "$SHA:refs/heads/production"
          fi
